<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#143d59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TOEFL复习">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>TOEFL 复习</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">TOEFL Notes</p>
          <h1>托福复习</h1>
        </div>
        <button class="icon-button" id="shuffleBtn" aria-label="随机换题" title="随机换题">
          <span aria-hidden="true">↻</span>
        </button>
      </header>

      <main>
        <section class="stats-grid" aria-label="复习统计">
          <div>
            <span id="totalCount">0</span>
            <small>词条</small>
          </div>
          <div>
            <span id="masteredCount">0</span>
            <small>已会</small>
          </div>
          <div>
            <span id="wrongCount">0</span>
            <small>错词</small>
          </div>
          <div>
            <span id="todayPracticeCount">0</span>
            <small>今日练习</small>
          </div>
          <div>
            <span id="spellingAccuracy">0%</span>
            <small>拼写正确率</small>
          </div>
          <div>
            <span id="streakCount">0</span>
            <small>连续天数</small>
          </div>
        </section>

        <section class="daily-card" aria-label="今日任务">
          <div class="daily-head">
            <h2>今日任务</h2>
            <span id="todayReviewCount">今日错题复习：0 条</span>
          </div>
          <div class="daily-task-grid">
            <button data-task-view="quiz">单词复习：<span id="wordTaskCount">0/100</span></button>
            <button data-task-view="spelling">拼写练习：<span id="spellingTaskCount">0/50</span></button>
            <button data-task-view="dictation">听写练习：<span id="dictationTaskCount">0/50</span></button>
          </div>
          <div class="daily-review" id="todayReviewList"></div>
          <p id="tomorrowReviewCount">已加入明日复习：0 条</p>
        </section>

        <nav class="tabs" aria-label="复习模式">
          <button class="tab is-active" data-view="quiz">自测卡片</button>
          <button class="tab" data-view="spelling">拼写</button>
          <button class="tab" data-view="dictation">听写</button>
          <button class="tab" data-view="wrong">错词</button>
          <button class="tab" data-view="speaking">口语</button>
          <button class="tab" data-view="library">资料库</button>
        </nav>

        <section class="toolbar">
          <label>
            <span>范围</span>
            <select id="sectionSelect"></select>
          </label>
          <label>
            <span>方向</span>
            <select id="directionSelect">
              <option value="mixed">中英混合</option>
              <option value="en-zh">英译中</option>
              <option value="zh-en">中译英</option>
            </select>
          </label>
          <label>
            <span>发音</span>
            <select id="voiceAccentSelect">
              <option value="en-US">美音</option>
              <option value="en-GB">英音</option>
            </select>
          </label>
          <label>
            <span>语速</span>
            <select id="voiceRateSelect">
              <option value="slow">慢速</option>
              <option value="normal">正常</option>
            </select>
          </label>
          <label class="voice-select-label">
            <span>语音</span>
            <select id="voiceSelect"></select>
          </label>
          <button id="refreshVoices" type="button">刷新语音列表</button>
          <div class="voice-status" id="voiceStatus" aria-live="polite">语音加载中</div>
        </section>

        <section class="view is-active" id="quizView">
          <div class="quiz-card">
            <div class="quiz-meta">
              <span id="quizIndex">1 / 5</span>
              <span id="quizSection">全部</span>
            </div>
            <button class="speak-button" id="speakQuiz" aria-label="播放当前题目发音">▶ 发音</button>
            <button class="speak-button" id="lookupCard" aria-label="查询当前单词词典">查询词典</button>
            <p class="prompt" id="quizPrompt"></p>
            <button class="primary" id="showBtn">显示答案</button>
            <div class="feedback" id="feedback" aria-live="polite"></div>
            <div class="feedback" id="dictionaryFeedback" aria-live="polite"></div>
          </div>
          <div class="button-row bottom-actions">
            <button id="knowBtn">我会了</button>
            <button id="missBtn">还不会</button>
          </div>
        </section>

        <section class="view" id="spellingView">
          <div class="spelling-card">
            <div class="quiz-meta">
              <span id="spellingSection">全部</span>
              <span id="spellingStats">0 对 · 0 错 · 0%</span>
            </div>
            <button class="speak-button" id="speakSpelling" aria-label="播放当前单词发音">▶ 发音</button>
            <p class="meaning-prompt" id="spellingMeaning"></p>
            <p class="example-line" id="spellingExample"></p>
            <input id="spellingInput" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="输入英文拼写">
            <div class="button-row spelling-submit-row">
              <button class="primary" id="checkSpelling">提交</button>
            </div>
            <div class="feedback" id="spellingFeedback" aria-live="polite"></div>
            <div class="button-row spelling-mastery-actions" id="spellingMasteryActions" hidden>
              <button class="primary" id="spellingKnow">我会了</button>
              <button id="spellingMiss">还不会</button>
            </div>
          </div>
        </section>

        <section class="view" id="dictationView">
          <div class="dictation-card">
            <div class="quiz-meta">
              <span>Dictation</span>
              <span id="dictationSection">全部</span>
            </div>
            <button class="speak-button" id="playDictation" aria-label="播放听写内容">▶ 播放</button>
            <textarea id="dictationInput" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="输入你听到的英文"></textarea>
            <div class="button-row">
              <button class="primary" id="checkDictation">提交</button>
              <button id="newDictation">换一句</button>
            </div>
            <div class="dictation-result" id="dictationResult" aria-live="polite"></div>
          </div>
        </section>

        <section class="view" id="wrongView">
          <div class="list-head">
            <h2>错词本</h2>
            <button id="clearWrong">清空</button>
          </div>
          <div class="word-list" id="wrongList"></div>
        </section>

        <section class="view" id="speakingView">
          <article class="speaking-card">
            <span>Speaking</span>
            <button class="speak-button" id="speakSpeaking" aria-label="播放口语题目发音">▶ 发音</button>
            <h2 id="speakingPrompt"></h2>
            <ul id="speakingTargets"></ul>
          </article>
          <div class="recording-panel">
            <div class="recording-status" id="recordingStatus">尚未录音</div>
            <div class="button-row">
              <button class="primary" id="startRecording">开始录音</button>
              <button id="stopRecording" disabled>停止录音</button>
            </div>
            <audio id="recordingPlayback" controls hidden></audio>
            <div class="button-row">
              <button id="deleteRecording" disabled>删除录音</button>
              <button id="submitRecording" disabled>提交检测</button>
            </div>
            <div class="feedback" id="recordingFeedback" aria-live="polite"></div>
          </div>
          <div class="button-row bottom-actions">
            <button id="newSpeaking">换一题</button>
            <button id="markSpeaking">完成一次</button>
          </div>
        </section>

        <section class="view" id="libraryView">
          <div class="library-panel">
            <div class="list-head">
              <h2>资料库</h2>
              <span id="libraryCount">0 条</span>
            </div>
            <div class="library-controls">
              <input id="librarySearch" autocomplete="off" placeholder="搜索英文 / 中文 / 分类">
              <select id="libraryType">
                <option value="all">全部</option>
                <option value="word">单词/短语</option>
                <option value="dictation">听写</option>
                <option value="speaking">口语</option>
                <option value="updates">最近修改</option>
              </select>
            </div>
            <div class="library-list" id="libraryList"></div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./data.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
